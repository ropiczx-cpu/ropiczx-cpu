<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Muhamad Ropi — identity card</title>
  <desc id="desc">Editorial identity card listing the name Muhamad Ropi, GitHub username ropiczx-cpu and Instagram handle @aslrov1.</desc>

  <defs>
    <pattern id="lines" width="6" height="40" patternUnits="userSpaceOnUse">
      <rect width="1" height="40" fill="#252525"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="#000000"/>
  <rect x="0.5" y="0.5" width="959" height="539" fill="none" stroke="#252525"/>
  <rect x="24.5" y="24.5" width="911" height="491" fill="none" stroke="#252525"/>

  <!-- right panel -->
  <rect x="640" y="25" width="295" height="490" fill="#0A0A0A"/>
  <rect x="640" y="450" width="295" height="40" fill="url(#lines)"/>
  <g fill="none">
    <circle cx="788" cy="215" r="104" stroke="#252525"/>
    <circle cx="788" cy="215" r="78" stroke="#B0B0B0" stroke-width="0.75"/>
    <path d="M788 137 A78 78 0 0 1 788 293 Z" fill="#FFFFFF"/>
    <circle cx="788" cy="215" r="30" fill="#0A0A0A" stroke="#B0B0B0" stroke-width="0.75"/>
    <line x1="788" y1="95" x2="788" y2="335" stroke="#252525"/>
  </g>
  <line x1="640" y1="25" x2="640" y2="515" stroke="#252525"/>

  <!-- small monogram -->
  <g transform="translate(64 64) scale(0.15)" fill="none" stroke="#FFFFFF" stroke-width="30">
    <line x1="150" y1="104" x2="150" y2="296"/>
    <path d="M150 119 H218 A47 47 0 0 1 218 213 H150"/>
    <line x1="206" y1="213" x2="262" y2="296"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#B0B0B0" font-size="11" letter-spacing="3">
    <text x="128" y="85">IDENTITY CARD</text>
    <text x="128" y="103" fill="#6A6A6A">PERSONAL / NO. 01</text>
    <text x="64" y="316">GITHUB</text>
    <text x="64" y="394">INSTAGRAM</text>
    <text x="672" y="474" fill="#6A6A6A" font-size="10">ROPICZX-CPU / ASLROV1</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" fill="#FFFFFF">
    <text x="62" y="212" font-size="64" letter-spacing="1">Muhamad</text>
    <text x="62" y="272" font-size="64" letter-spacing="1" font-style="italic" fill="#B0B0B0">Ropi</text>
    <text x="64" y="346" font-size="28">ropiczx-cpu</text>
    <text x="64" y="424" font-size="28">@aslrov1</text>
  </g>

  <g stroke="#252525">
    <line x1="64" y1="296" x2="576" y2="296"/>
    <line x1="64" y1="374" x2="576" y2="374"/>
    <line x1="64" y1="452" x2="576" y2="452"/>
  </g>
  <line x1="64" y1="296" x2="104" y2="296" stroke="#FFFFFF"/>
  <line x1="64" y1="374" x2="104" y2="374" stroke="#FFFFFF"/>
</svg>
