<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">MUHAMAD ROPI</title>
  <desc id="desc">Monochrome editorial banner: the name set in large serif capitals beside an abstract composition of circles and fine lines.</desc>

  <defs>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#252525"/>
    </pattern>
    <clipPath id="field">
      <rect x="760" y="0" width="520" height="420"/>
    </clipPath>
  </defs>

  <!-- ground -->
  <rect width="1280" height="420" fill="#000000"/>
  <rect x="760" width="520" height="420" fill="url(#grain)"/>

  <!-- abstract field -->
  <g clip-path="url(#field)" fill="none">
    <line x1="1020" y1="0" x2="1020" y2="420" stroke="#252525" stroke-width="1"/>
    <line x1="760" y1="210" x2="1280" y2="210" stroke="#252525" stroke-width="1"/>
    <circle cx="1020" cy="210" r="190" stroke="#252525" stroke-width="1"/>
    <circle cx="1020" cy="210" r="150" stroke="#B0B0B0" stroke-width="0.75"/>
    <!-- solid right half -->
    <path d="M1020 60 A150 150 0 0 1 1020 360 Z" fill="#FFFFFF"/>
    <!-- offset void and echo -->
    <circle cx="1020" cy="210" r="62" fill="#000000"/>
    <circle cx="1020" cy="210" r="62" stroke="#B0B0B0" stroke-width="0.75"/>
    <path d="M1020 148 A62 62 0 0 1 1020 272 Z" fill="#0A0A0A"/>
    <circle cx="1020" cy="210" r="3" fill="#FFFFFF"/>
    <!-- small satellite -->
    <circle cx="1170" cy="210" r="10" stroke="#B0B0B0" stroke-width="0.75"/>
    <circle cx="1170" cy="210" r="2" fill="#B0B0B0"/>
  </g>

  <!-- frame ticks -->
  <g stroke="#B0B0B0" stroke-width="1" fill="none">
    <path d="M32 56 V32 H56"/>
    <path d="M1224 32 H1248 V56"/>
    <path d="M32 364 V388 H56"/>
    <path d="M1224 388 H1248 V364"/>
  </g>

  <!-- typography -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#B0B0B0">
    <text x="72" y="80" font-size="11" letter-spacing="3.5">PERSONAL ARCHIVE</text>
    <text x="72" y="364" font-size="11" letter-spacing="3">ROPICZX-CPU</text>
    <text x="260" y="364" font-size="11" letter-spacing="3" fill="#6A6A6A">/</text>
    <text x="280" y="364" font-size="11" letter-spacing="3">@ASLROV1</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" fill="#FFFFFF">
    <text x="68" y="214" font-size="96" letter-spacing="6">MUHAMAD</text>
    <text x="68" y="312" font-size="96" letter-spacing="6" font-style="italic" fill="#B0B0B0">ROPI</text>
  </g>

  <line x1="72" y1="334" x2="700" y2="334" stroke="#252525" stroke-width="1"/>
  <line x1="72" y1="334" x2="132" y2="334" stroke="#FFFFFF" stroke-width="1"/>
</svg>
