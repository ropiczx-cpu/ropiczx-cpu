<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Archive — Muhamad Ropi</title>

<!--
  MEDIA SETUP
  -----------
  Put your music file at  music.mp3  (MP3, or an MP4 with or without video, also works),
  or change CONFIG.src below. Use only music you have the rights to share.
  Title / artist / album are also set in CONFIG.
-->

<style>
  :root {
    --black: #000000;
    --deep: #0A0A0A;
    --white: #FFFFFF;
    --gray: #B0B0B0;
    --dim: #6A6A6A;
    --line: #252525;
    --serif: Georgia, "Times New Roman", "Liberation Serif", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 1px solid var(--white); outline-offset: 3px; }

  .shell {
    width: 100%;
    max-width: 920px;
    border: 1px solid var(--line);
    background: var(--deep);
  }

  .bar {
    display: flex;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
  }

  .bar a { color: var(--gray); text-decoration: none; transition: color .2s; }
  .bar a:hover { color: var(--white); }

  .main {
    display: grid;
    grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
  }

  /* artwork */
  .art {
    position: relative;
    aspect-ratio: 1;
    border-right: 1px solid var(--line);
    background: var(--black);
    overflow: hidden;
  }
  .art svg, .art video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }
  .art video { object-fit: cover; opacity: 0; transition: opacity .4s; background: var(--black); }
  .art.has-video video { opacity: 1; }
  .art.has-video svg { opacity: 0; }

  /* right column */
  .side {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 28px 32px 24px;
    min-width: 0;
  }

  .eyebrow { color: var(--dim); font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(30px, 5vw, 46px);
    line-height: 1.08;
    letter-spacing: 0;
    margin: 10px 0 8px;
    overflow-wrap: anywhere;
  }
  .artist { color: var(--gray); font-family: var(--serif); font-style: italic; font-size: 17px; letter-spacing: 0; }

  .status {
    min-height: 16px;
    margin-top: 14px;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .is-error .status { color: var(--gray); }

  /* visualizer: decorative, runs only while playing */
  .viz { display: flex; align-items: flex-end; gap: 3px; height: 34px; margin: 22px 0; }
  .viz i {
    flex: 1; max-width: 6px; height: 4px;
    background: var(--gray);
    transform-origin: bottom;
    opacity: .5;
  }
  .playing .viz i { animation: pulse 1.1s ease-in-out infinite alternate; opacity: 1; }
  @keyframes pulse { from { height: 4px; } to { height: 34px; } }

  /* transport */
  .controls { display: flex; align-items: center; gap: 16px; }

  .play {
    width: 40px; height: 40px;
    border: 1px solid var(--gray);
    border-radius: 50%;
    display: grid; place-items: center;
    flex: none;
    transition: background .2s, border-color .2s, color .2s;
  }
  .play:hover:not(:disabled) { background: var(--white); color: var(--black); border-color: var(--white); }
  .play svg { width: 14px; height: 14px; fill: currentColor; }
  .play .i-pause { display: none; }
  .playing .play .i-play { display: none; }
  .playing .play .i-pause { display: block; }

  .time { color: var(--gray); font-variant-numeric: tabular-nums; flex: none; min-width: 38px; }
  .time.total { text-align: right; }

  /* thin range inputs */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    background: none; width: 100%; height: 20px; cursor: pointer;
    --p: 0%;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 1px;
    background: linear-gradient(to right, var(--white) var(--p), var(--line) var(--p));
  }
  input[type=range]::-moz-range-track { height: 1px; background: var(--line); }
  input[type=range]::-moz-range-progress { height: 1px; background: var(--white); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 9px; height: 9px; margin-top: -4px;
    border-radius: 50%; background: var(--white); border: 0;
    transition: transform .15s;
  }
  input[type=range]::-moz-range-thumb { width: 9px; height: 9px; border-radius: 50%; background: var(--white); border: 0; }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.35); }
  input[type=range]:disabled { cursor: default; opacity: .4; }

  .seek-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }

  .vol { display: flex; align-items: center; gap: 10px; margin-left: auto; width: 150px; }
  .mute { width: 24px; height: 24px; display: grid; place-items: center; color: var(--gray); flex: none; transition: color .2s; }
  .mute:hover { color: var(--white); }
  .mute svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; }
  .mute .i-off { display: none; }
  .muted .mute .i-off { display: block; }
  .muted .mute .i-on { display: none; }

  button:disabled { opacity: .4; cursor: default; }

  /* info */
  .info {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    border-top: 1px solid var(--line);
  }
  .info div { padding: 14px 20px; border-right: 1px solid var(--line); min-width: 0; }
  .info div:last-child { border-right: 0; }
  .info dt { color: var(--dim); font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; margin-bottom: 6px; }
  .info dd { color: var(--gray); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0.04em; }

  @media (max-width: 720px) {
    .main { grid-template-columns: 1fr; }
    .art { border-right: 0; border-bottom: 1px solid var(--line); aspect-ratio: 1.3; }
    .side { padding: 22px 20px 20px; }
    .controls { flex-wrap: wrap; }
    .vol { width: 100%; margin-left: 0; margin-top: 6px; }
    .info { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .info div:nth-child(2) { border-right: 0; }
    .info div:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  }

  @media (prefers-reduced-motion: reduce) {
    .playing .viz i { animation: none !important; height: 14px; }
    * { transition: none !important; }
  }
</style>
</head>

<body>
<main class="shell" id="player">
  <div class="bar">
    <span>Archive / 01</span>
    <a href="https://github.com/ropiczx-cpu" rel="noopener">ropiczx-cpu</a>
  </div>

  <div class="main">
    <div class="art" id="art">
      <!-- placeholder artwork, replaced by the picture when the file contains video -->
      <svg viewBox="0 0 400 400" role="img" aria-label="Album artwork placeholder" preserveAspectRatio="xMidYMid slice">
        <rect width="400" height="400" fill="#000"/>
        <g fill="none">
          <line x1="200" y1="0" x2="200" y2="400" stroke="#252525"/>
          <line x1="0" y1="200" x2="400" y2="200" stroke="#252525"/>
          <circle cx="200" cy="200" r="150" stroke="#252525"/>
          <circle cx="200" cy="200" r="112" stroke="#B0B0B0" stroke-width="0.75"/>
          <path d="M200 88 A112 112 0 0 1 200 312 Z" fill="#FFF"/>
          <circle cx="200" cy="200" r="46" fill="#0A0A0A" stroke="#B0B0B0" stroke-width="0.75"/>
          <circle cx="200" cy="200" r="3" fill="#FFF"/>
        </g>
      </svg>
      <video id="media" playsinline preload="metadata"></video>
    </div>

    <section class="side">
      <div>
        <p class="eyebrow">Now loaded</p>
        <h1 id="title">Untitled</h1>
        <p class="artist" id="artist">Unknown artist</p>
        <p class="status" id="status" role="status" aria-live="polite">Ready</p>
      </div>

      <div>
        <div class="viz" aria-hidden="true" id="viz"></div>

        <div class="seek-row">
          <span class="time" id="cur">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek" disabled>
          <span class="time total" id="dur">0:00</span>
        </div>

        <div class="controls">
          <button class="play" id="play" type="button" aria-label="Play" disabled>
            <svg class="i-play" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z"/></svg>
            <svg class="i-pause" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5h3v11H3zM8 1.5h3v11H8z"/></svg>
          </button>

          <div class="vol">
            <button class="mute" id="mute" type="button" aria-label="Mute">
              <svg class="i-on" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z"/><path d="M11.5 5.5a3.5 3.5 0 0 1 0 5"/></svg>
              <svg class="i-off" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z"/><path d="M11.5 6l3 4M14.5 6l-3 4"/></svg>
            </button>
            <input type="range" id="vol" min="0" max="100" value="80" step="1" aria-label="Volume">
          </div>
        </div>
      </div>
    </section>
  </div>

  <dl class="info">
    <div><dt>Album</dt><dd id="i-album">—</dd></div>
    <div><dt>Format</dt><dd id="i-format">MP4</dd></div>
    <div><dt>Length</dt><dd id="i-length">—</dd></div>
    <div><dt>Source</dt><dd id="i-src">—</dd></div>
  </dl>
</main>

<noscript><p style="margin-top:16px;color:#B0B0B0">This player needs JavaScript.</p></noscript>

<script>
(function () {
  'use strict';

  /* ---- edit these ---- */
  var CONFIG = {
    src: 'music.mp3',
    title: 'Am I Bothering You',
    artist: 'Reality Club',
    album: '—'
  };

  var $ = function (id) { return document.getElementById(id); };
  var media = $('media'), player = $('player'), art = $('art');
  var playBtn = $('play'), seek = $('seek'), vol = $('vol'), muteBtn = $('mute');
  var cur = $('cur'), dur = $('dur'), statusEl = $('status');
  var seeking = false;

  /* static text */
  $('title').textContent = CONFIG.title;
  $('artist').textContent = CONFIG.artist;
  $('i-album').textContent = CONFIG.album;
  $('i-src').textContent = CONFIG.src;
  document.title = CONFIG.title + ' — ' + CONFIG.artist;

  /* visualizer bars (decorative; staggered CSS animation) */
  var viz = $('viz');
  for (var i = 0; i < 28; i++) {
    var b = document.createElement('i');
    b.style.animationDuration = (0.7 + ((i * 37) % 60) / 100) + 's';
    b.style.animationDelay = (-((i * 53) % 90) / 100) + 's';
    viz.appendChild(b);
  }

  function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function setStatus(t) { statusEl.textContent = t; }
  function setFill(el) {
    var max = +el.max || 1;
    el.style.setProperty('--p', (el.value / max * 100) + '%');
  }

  function showError() {
    player.classList.add('is-error');
    player.classList.remove('playing');
    playBtn.disabled = true;
    seek.disabled = true;
    setStatus('Media not found — add a file at ' + CONFIG.src);
    $('i-length').textContent = '—';
  }

  /* media events (attached before src is set so early errors are caught) */
  media.addEventListener('loadedmetadata', function () {
    dur.textContent = fmt(media.duration);
    $('i-length').textContent = fmt(media.duration);
    playBtn.disabled = false;
    seek.disabled = false;
    if (media.videoWidth > 0) art.classList.add('has-video');
    var ext = (CONFIG.src.split('.').pop() || 'media').toUpperCase();
    $('i-format').textContent = ext + (media.videoWidth > 0 ? ' · video' : ' · audio');
    setStatus('Ready');
  });

  media.addEventListener('timeupdate', function () {
    if (seeking) return;
    cur.textContent = fmt(media.currentTime);
    if (media.duration) {
      seek.value = media.currentTime / media.duration * 1000;
      setFill(seek);
    }
  });

  media.addEventListener('play', function () {
    player.classList.add('playing');
    playBtn.setAttribute('aria-label', 'Pause');
    setStatus('Playing');
  });
  media.addEventListener('pause', function () {
    player.classList.remove('playing');
    playBtn.setAttribute('aria-label', 'Play');
    if (!media.ended && !player.classList.contains('is-error')) setStatus('Paused');
  });
  media.addEventListener('ended', function () {
    seek.value = 0; setFill(seek);
    cur.textContent = '0:00';
    setStatus('Finished');
  });
  media.addEventListener('waiting', function () { setStatus('Loading…'); });
  media.addEventListener('playing', function () { setStatus('Playing'); });
  media.addEventListener('error', showError);
  media.addEventListener('volumechange', function () {
    var silent = media.muted || media.volume === 0;
    player.classList.toggle('muted', silent);
    muteBtn.setAttribute('aria-label', silent ? 'Unmute' : 'Mute');
    vol.value = media.muted ? 0 : Math.round(media.volume * 100);
    setFill(vol);
  });

  /* controls */
  function toggle() {
    if (playBtn.disabled) return;
    if (media.paused) {
      var p = media.play();
      if (p && p.catch) p.catch(function () { setStatus('Playback blocked — press play again'); });
    } else {
      media.pause();
    }
  }
  playBtn.addEventListener('click', toggle);

  seek.addEventListener('input', function () {
    seeking = true;
    setFill(seek);
    if (media.duration) cur.textContent = fmt(seek.value / 1000 * media.duration);
  });
  seek.addEventListener('change', function () {
    if (media.duration) media.currentTime = seek.value / 1000 * media.duration;
    seeking = false;
  });

  vol.addEventListener('input', function () {
    media.muted = false;
    media.volume = vol.value / 100;
  });
  muteBtn.addEventListener('click', function () {
    if (media.muted || media.volume === 0) {
      media.muted = false;
      if (media.volume === 0) media.volume = 0.5;
    } else {
      media.muted = true;
    }
  });

  /* keyboard: space, arrows, m */
  document.addEventListener('keydown', function (e) {
    var t = e.target.tagName;
    if (t === 'INPUT' || t === 'BUTTON') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight' && media.duration) media.currentTime = Math.min(media.duration, media.currentTime + 5);
    else if (e.key === 'ArrowLeft') media.currentTime = Math.max(0, media.currentTime - 5);
    else if (e.key === 'm' || e.key === 'M') muteBtn.click();
  });

  /* init: no autoplay */
  media.volume = 0.8;
  setFill(vol); setFill(seek);
  media.src = CONFIG.src;
  media.load();
})();
</script>
</body>
</html>
